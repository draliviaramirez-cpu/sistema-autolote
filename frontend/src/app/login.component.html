<main class="login-page">
  <form class="login-form" (ngSubmit)="login()">
    <div class="login-heading">
      <p class="eyebrow">Sistema de gestión</p>
      <h1>Acceso al autolote</h1>
      <p class="subtitle">Ingresa tus credenciales para continuar.</p>
    </div>

    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" autocomplete="email" placeholder="correo@ejemplo.com" required>

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" autocomplete="current-password" placeholder="Escribe tu contraseña" required>

    <button type="submit" [disabled]="loading">
      {{ loading ? 'Entrando...' : 'Iniciar sesión' }}
    </button>
    @if (error) {
      <p class="error-message" role="alert">{{ error }}</p>
    }
  </form>
</main>
